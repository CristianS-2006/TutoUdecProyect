name: Build TutoUdec Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Validate EAS configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "Configura el secreto EXPO_TOKEN con un token de acceso de EAS." >&2; exit 1; }
          case "$EXPO_PUBLIC_API_URL" in
            https://*) ;;
            *) echo "Configura EXPO_PUBLIC_API_URL con la URL HTTPS de la API." >&2; exit 1 ;;
          esac
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build preview APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: npx --yes eas-cli@25.2.0 build --platform android --profile preview --non-interactive
