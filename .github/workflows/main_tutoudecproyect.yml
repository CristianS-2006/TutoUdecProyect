name: Build and deploy TutoUdec

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies and run checks
        working-directory: backend
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
          python manage.py check
          python manage.py test
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.git/**
            !backend/antenv/**
            !backend/venv/**
            !web/node_modules/**
            !mobile/node_modules/**
            !web/dist/**

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download application
        uses: actions/download-artifact@v4
        with:
          name: python-app
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A6605058DA2C4659A81169CA679A4725 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7132D8C93B344B409DDBDE5D068B1D44 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CFDFA4E6930F409B8629A3A4ACC2A03D }}
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: TutoUdecProyect
          slot-name: Production
          package: .
          startup-command: python manage.py migrate --noinput && gunicorn --bind=0.0.0.0 --timeout 600 backend.wsgi:application
